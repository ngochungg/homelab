---
services:
  app:
    container_name: portainer
    image: portainer/portainer-ce:alpine-sts
    ports:
      # --> (Optional) Remove when using traefik...
      - 9000:9000
      - 9443:9443
      # <--
#      - 8000:8000
    volumes:
      - /run/docker.sock:/var/run/docker.sock
      - /hdd/docker/data/portainer/:/data
    restart: unless-stopped

volumes:
  portainer-data:
    driver: local
